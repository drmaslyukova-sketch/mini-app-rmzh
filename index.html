{text}`,SUBTYPE_TEXT:{lum_a:`Гормонозависимая опухоль (рецепторы гормонов положительные) с низкой скоростью деления клеток, без гиперэкспрессии HER2. Обычно это наиболее благоприятный подтип.

Основа лечения — <b>химиотерапия в сочетании с анти-HER2-препаратами</b>. Такие опухоли хорошо отвечают на современную таргетную терапию. Гормонотерапия не применяется.`,triple_neg:`Рецепторы эстрогенов, прогестерона и HER2 отрицательные.

Гормонотерапия и стандартная анти-HER2-терапия не применяются. Основа лекарственного лечения — <b>химиотерапия</b>, в ряде ситуаций в сочетании с <b>иммунотерапией</b>.

По рекомендациям RUSSCO при тройном негативном раке в любом возрасте показано <b>генетическое тестирование на мутации BRCA</b>: результат может повлиять на лечение.`,er_neg_pr_pos:`Сочетание «РЭ отрицательные, РП положительные» встречается редко.

Бот помогает разобраться в диагнозе «рак молочной железы» по клиническим рекомендациям <b>RUSSCO 2025</b>. Шаги — на схеме выше.

Понадобится заключение ИГХ с РЭ (ER), РП (PR), HER2 и Ki-67. Если лечение уже было, берите данные биопсии до его начала.

Бот не ставит диагноз и не назначает лечение: это информация, а не медицинская консультация. Ответы хранятся только на вашем телефоне, чтобы не вводить их заново; имя и контакты не нужны.

<i>18+. Пользуясь ботом и покупая книгу, вы принимаете условия оферты.</i>`,WHAT_IS_SUBTYPE:`<b>Что такое суррогатный подтип</b>

Рак молочной железы — это несколько разных по биологии заболеваний. Их делят на молекулярно-биологические подтипы. В обычной практике подтип определяют «суррогатно» — по четырём показателям ИГХ:

• <b>РЭ (ER)</b> — рецепторы эстрогенов
• <b>РП (PR)</b> — рецепторы прогестерона
• <b>HER2</b> — белок-рецептор, отвечающий за рост клеток
• <b>Ki-67</b> — показатель скорости деления клеток

Выделяют подтипы: люминальный A, люминальный B (HER2-отрицательный и HER2-положительный), HER2-положительный нелюминальный и тройной негативный.`,GRAY_INTRO:`Ki-67 попал в <b>промежуточный диапазон</b>: больше 20 %, но меньше 30 %. По рекомендациям RUSSCO 2025 в этом случае подтип оценивают с учётом других факторов.

Ответьте, пожалуйста, ещё на 4 вопроса по гистологическому заключению. Если ответа нет, нажмите «Не знаю».`,Q_G:`<b>Дополнительный вопрос 1 из 4. Степень злокачественности (G)</b>
