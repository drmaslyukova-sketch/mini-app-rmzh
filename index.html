{text}`,SUBTYPE_TEXT:{lum_a:`Гормонозависимая опухоль (рецепторы гормонов положительные) с низкой скоростью деления клеток, без гиперэкспрессии HER2. Обычно это наиболее благоприятный подтип.

Основа лекарственного лечения при таком подтипе — <b>гормонотерапия</b>. Нужна ли химиотерапия, решают индивидуально, с учётом стадии и других факторов.`,lum_b_her2neg:`Гормонозависимая опухоль без гиперэкспрессии HER2, но более активная, чем люминальный A (высокий Ki-67 и/или низкий уровень РП).

В лечении применяют <b>гормонотерапию</b>. <b>Химиотерапию</b> добавляют чаще, чем при люминальном A. Решение зависит от стадии, степени злокачественности, Ki-67 и других факторов.`,lum_ab_gray:`Рецепторы гормонов положительные, HER2 отрицательный, РП ≥ 20 %, а Ki-67 попадает в промежуточный диапазон (больше 20 %, но меньше 30 %).

По рекомендациям RUSSCO 2025 в этом диапазоне подтип и тактику оценивают с учётом <b>других факторов</b>: стадии, степени злокачественности (G), гистологического варианта, а также опыта конкретной лаборатории.`,lum_b_her2pos:`Опухоль одновременно гормонозависимая и HER2-положительная.

В лечении применяют <b>анти-HER2-препараты</b> (таргетную терапию) в сочетании с химиотерапией и <b>гормонотерапию</b>. Объём и последовательность лечения зависят от стадии.`,her2_nonlum:`Опухоль HER2-положительная, рецепторы гормонов отрицательные.

Основа лечения — <b>химиотерапия в сочетании с анти-HER2-препаратами</b>. Такие опухоли хорошо отвечают на современную таргетную терапию. Гормонотерапия не применяется.`,triple_neg:`Рецепторы эстрогенов, прогестерона и HER2 отрицательные.

Гормонотерапия и стандартная анти-HER2-терапия не применяются. Основа лекарственного лечения — <b>химиотерапия</b>, в ряде ситуаций в сочетании с <b>иммунотерапией</b>.

По рекомендациям RUSSCO при тройном негативном раке в любом возрасте показано <b>генетическое тестирование на мутации BRCA</b>: результат может повлиять на лечение.`,er_neg_pr_pos:`Сочетание «РЭ отрицательные, РП положительные» встречается редко.

По рекомендациям RUSSCO 2025 в таком случае нужно <b>повторно определить РП</b> и исключить фоновое окрашивание. Обсудите это с онкологом и морфологом.`,luminal_unspec:"Рецепторы эстрогенов положительные, HER2 отрицательный — это люминальный HER2-отрицательный рак. Чтобы различить люминальный A и B, не хватает данных (см. ниже).",incomplete:"Для определения подтипа не хватает ключевых данных (см. ниже)."},SUBTYPE_TITLE:{lum_a:"Люминальный A",lum_b_her2neg:"Люминальный B, HER2-отрицательный",lum_ab_gray:"Люминальный HER2-отрицательный: промежуточная зона между A и B",lum_b_her2pos:"Люминальный B, HER2-положительный",her2_nonlum:"HER2-положительный (нелюминальный)",triple_neg:"Тройной негативный (базальноподобный)",er_neg_pr_pos:"Атипичный фенотип: РЭ отрицательные, РП положительные",luminal_unspec:"Люминальный HER2-отрицательный (A или B — не хватает данных)",incomplete:"Подтип определить пока нельзя"},WELCOME:`Здравствуйте! 🎗

Бот помогает разобраться в диагнозе «рак молочной железы» по клиническим рекомендациям <b>RUSSCO 2025</b>. Шаги — на схеме выше.

Понадобится заключение ИГХ с РЭ (ER), РП (PR), HER2 и Ki-67. Если лечение уже было, берите данные биопсии до его начала.

Бот не ставит диагноз и не назначает лечение: это информация, а не медицинская консультация. Ответы не сохраняются, имя и контакты не нужны.

<i>18+. Пользуясь ботом и покупая книгу, вы принимаете условия оферты.</i>`,WHAT_IS_SUBTYPE:`<b>Что такое суррогатный подтип</b>

Рак молочной железы — это несколько разных по биологии заболеваний. Их делят на молекулярно-биологические подтипы. В обычной практике подтип определяют «суррогатно» — по четырём показателям ИГХ:

• <b>РЭ (ER)</b> — рецепторы эстрогенов
• <b>РП (PR)</b> — рецепторы прогестерона
• <b>HER2</b> — белок-рецептор, отвечающий за рост клеток
• <b>Ki-67</b> — показатель скорости деления клеток

Выделяют подтипы: люминальный A, люминальный B (HER2-отрицательный и HER2-положительный), HER2-положительный нелюминальный и тройной негативный.`,GRAY_INTRO:`Ki-67 попал в <b>промежуточный диапазон</b>: больше 20 %, но меньше 30 %. По рекомендациям RUSSCO 2025 в этом случае подтип оценивают с учётом других факторов.

Ответьте, пожалуйста, ещё на 4 вопроса по гистологическому заключению. Если ответа нет, нажмите «Не знаю».`,Q_G:`<b>Дополнительный вопрос 1 из 4. Степень злокачественности (G)</b>
